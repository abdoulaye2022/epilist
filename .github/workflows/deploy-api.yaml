name: Deploy API via FTP

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # Étape 1 : Checkout le code
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Étape 2 : Configurer PHP
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          # Doit correspondre au PHP du serveur de prod (8.3.x sur OVH)
          php-version: '8.3'
          tools: composer
          coverage: none

      # Étape 3 : Installer les dépendances
      - name: Install dependencies
        working-directory: ./api
        run: |
          composer install --no-dev --prefer-dist --optimize-autoloader --no-interaction
          composer dump-autoload --optimize

      # Étape 4 : Vérification syntaxique de tout le PHP avant d'envoyer en prod
      - name: PHP lint
        working-directory: ./api
        run: find src public -name '*.php' -print0 | xargs -0 -n1 -P4 php -l > /dev/null

      # Étape 5 : Vérifier la structure avant déploiement
      - name: List files to deploy
        working-directory: ./api
        run: ls -la

      # Étape 6 : Déploiement FTP
      - name: Deploy to server
        uses: SamKirkland/FTP-Deploy-Action@v4.3.0  # Version vérifiée et fonctionnelle
        with:
          server: ${{ secrets.FTP_SERVER_EL }}
          username: ${{ secrets.FTP_USERNAME_EL }}
          password: ${{ secrets.FTP_PASSWORD_EL }}
          local-dir: ./api/
          server-dir: /www/api.epilist/
          dangerous-clean-slate: false
          # Sécurité : ne jamais envoyer en prod les scripts de test/debug,
          # les migrations SQL, les secrets ni la doc — le docroot du serveur
          # est au-dessus de public/, tout fichier envoyé est téléchargeable.
          exclude: |
            **/.git*
            **/.env*
            **/service-account.json
            **/README.md
            **/*.md
            **/composer.*
            **/vendor/tests/*
            **/migrations/**
            **/storage/**
            test_*.php
            generate_test_data.php
            run_migration_language.php
            check_*.php
          log-level: verbose